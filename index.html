<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Desk Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Desk Board</h1>
    <span class="task-badge" id="taskTotal">0 task</span>
  </div>

  <div class="topbar-right">
    <div class="clock" id="clock">--:--</div>
    <button class="settings-toggle" id="settingsToggle" title="Settings">⚙</button>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <label class="settings-row">
    <span>Background blur</span>
    <input type="range" id="blurRange" min="0" max="40" step="1">
    <span class="settings-value" id="blurValue">0px</span>
  </label>
  <label class="settings-row">
    <span>Dark overlay</span>
    <input type="range" id="dimRange" min="0" max="80" step="1">
    <span class="settings-value" id="dimValue">0%</span>
  </label>
  <label class="settings-row">
    <span>Background URL</span>
    <input type="text" id="bgUrlInput" placeholder="image, gif or video link" autocomplete="off" spellcheck="false">
  </label>
  <button class="bg-clear-btn" id="bgClearBtn">clear background</button>
  <label class="settings-row">
    <span>Click to move</span>
    <input type="checkbox" id="clickToMoveToggle">
  </label>
  <div class="settings-hint">use this if drag feels stuck, e.g. Wallpaper Engine</div>
</div>

<div class="background-layer" id="backgroundLayer">
  <img id="backgroundImage" alt="">
  <video id="backgroundVideo" muted loop playsinline></video>
</div>

<div class="backdrop-blur" id="backdropBlur"></div>

<div class="board" id="board"></div>

<div class="drag-layer" id="dragLayer"></div>

<div class="pick-hint" id="pickHint">tap a spot to drop it, tap the card again to cancel</div>

<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <div class="modal-row">
      <label>Title</label>
      <input type="text" id="editTitleInput" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-row" id="editDescRow">
      <label>Note</label>
      <textarea id="editDescInput" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="editCancelBtn">Cancel</button>
      <button class="modal-btn primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Flip.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
