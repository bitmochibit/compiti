<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compiti</title>
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/scss/main.scss">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Compiti</h1>
    <span class="task-badge" id="taskTotal">0 task</span>
  </div>

  <div class="topbar-right">
    <div class="clock" id="clock">--:--</div>
    <button class="settings-toggle" id="settingsToggle" title="Settings">⚙</button>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <label class="settings-row">
    <span>Background blur</span>
    <input type="range" id="blurRange" min="0" max="40" step="1">
    <span class="settings-value" id="blurValue">0px</span>
  </label>
  <label class="settings-row">
    <span>Dark overlay</span>
    <input type="range" id="dimRange" min="0" max="80" step="1">
    <span class="settings-value" id="dimValue">0%</span>
  </label>
  <label class="settings-row">
    <span>Background URL</span>
    <input type="text" id="bgUrlInput" placeholder="image, gif or video link" autocomplete="off" spellcheck="false">
  </label>
  <button class="bg-clear-btn" id="bgClearBtn">clear background</button>
  <label class="settings-row">
    <span>Accent color</span>
    <input type="color" id="accentColorInput" value="#e8a33d">
  </label>
  <label class="settings-row">
    <span>Click to move</span>
    <input type="checkbox" id="clickToMoveToggle">
  </label>
  <label class="settings-row">
    <span>Mute sounds</span>
    <input type="checkbox" id="muteToggle">
  </label>
  <div class="settings-divider">Custom sounds</div>
  <label class="settings-row">
    <span>Pickup sound</span>
    <input type="text" id="soundPickupInput" placeholder="url, blank = default" autocomplete="off" spellcheck="false">
  </label>
  <label class="settings-row">
    <span>Drop sound</span>
    <input type="text" id="soundDropInput" placeholder="url, blank = default" autocomplete="off" spellcheck="false">
  </label>
  <label class="settings-row">
    <span>Hop sound</span>
    <input type="text" id="soundHopInput" placeholder="url, blank = default" autocomplete="off" spellcheck="false">
  </label>
  <button class="bg-clear-btn" id="soundsResetBtn">reset to default sounds</button>
  <div class="settings-divider">Backup</div>
  <div class="settings-backup-actions">
    <button class="bg-clear-btn" id="exportSettingsBtn">export settings</button>
    <button class="bg-clear-btn" id="importSettingsBtn">import settings</button>
  </div>
  <input type="file" id="importSettingsFile" accept="application/json" hidden>
  <div class="settings-hint">use "click to move" if you don't like the dragging animation</div>
</div>

<div class="background-layer" id="backgroundLayer">
  <img id="backgroundImage" alt="">
  <video id="backgroundVideo" muted loop playsinline></video>
</div>

<div class="backdrop-blur" id="backdropBlur"></div>

<div class="board" id="board"></div>

<button class="board-scroll-btn left" id="scrollLeftBtn" title="Scroll left">
  <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-01"></i>
</button>
<button class="board-scroll-btn right" id="scrollRightBtn" title="Scroll right">
  <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-01"></i>
</button>

<div class="drag-layer" id="dragLayer"></div>

<div class="pick-hint" id="pickHint">tap a spot to drop it, tap the card again to cancel</div>

<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <div class="modal-row">
      <label>Title</label>
      <input type="text" id="editTitleInput" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-row" id="editDescRow">
      <label>Note</label>
      <textarea id="editDescInput" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="modal-row" id="editLabelsRow">
      <label>Labels</label>
      <input type="text" id="editLabelsInput" placeholder="comma, separated, labels" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-row" id="editDoneRow">
      <label class="modal-checkbox-label">
        <input type="checkbox" id="editDoneInput">
        <span>Mark tasks dropped here as completed</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="editCancelBtn">Cancel</button>
      <button class="modal-btn primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Flip.min.js"></script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
